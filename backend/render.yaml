services:
  - type: web
    name: document-qa-api
    runtime: python
    # Repo is document-qa → Root Directory in Render UI must be: backend
    # (enter "backend", not "document-qa/backend")
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: INGEST_ON_STARTUP
        value: "false"
